name: Functional Tests

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  functional-tests:
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v4

      - uses: pnpm/action-setup@v4
        with:
          version: 10.17.0

      - uses: actions/setup-node@v4
        with:
          node-version: "24"
          cache: "pnpm"

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Start test server
        run: pnpm test:server:start

      - name: Wait for server to be healthy
        run: |
          timeout 60 bash -c 'until curl -sf http://localhost:8080/.well-known/jmap; do sleep 2; done'

      - name: Seed test data
        run: pnpm seed-test-data

      - name: Run functional tests
        run: pnpm test:functional

      - name: Stop test server
        if: always()
        run: pnpm test:server:stop
