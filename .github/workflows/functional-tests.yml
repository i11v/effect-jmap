name: Functional Tests

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  functional-tests:
    runs-on: ubuntu-latest

    services:
      stalwart:
        image: stalwartlabs/stalwart:latest
        ports:
          - 8080:8080
        env:
          STALWART_ADMIN_PASSWORD: test-admin-password
        options: >-
          --health-cmd "curl -f http://localhost:8080/.well-known/jmap || exit 1"
          --health-interval 5s
          --health-timeout 3s
          --health-retries 30
          --health-start-period 10s

    steps:
      - uses: actions/checkout@v4

      - uses: pnpm/action-setup@v4
        with:
          version: 10.17.0

      - uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: "pnpm"

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Wait for Stalwart to be ready
        run: |
          echo "Waiting for Stalwart server..."
          for i in {1..30}; do
            if curl -s -o /dev/null -w "%{http_code}" http://localhost:8080/.well-known/jmap | grep -qE "200|307"; then
              echo "Stalwart is ready!"
              break
            fi
            echo "Attempt $i: Stalwart not ready yet..."
            sleep 2
          done

      - name: Seed test data
        run: pnpm seed-test-data

      - name: Run functional tests
        run: pnpm test:functional
